# iOS build on Codemagic (a Mac in the cloud): builds the game, signs it with the
# Apple Developer account and uploads it to App Store Connect / TestFlight.
#
# Before the first build, in Codemagic:
#   Team settings > Integrations > Developer Portal: add the App Store Connect API key
#   and name it "app-store-connect" (the name used below).
# In Apple's developer site the bundle ID com.vicdanlihakim.oyun must exist, and in
# App Store Connect an app with that bundle ID.
workflows:
  ios-testflight:
    name: iOS – TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app-store-connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vicdanlihakim.oyun
      node: 22
      xcode: latest
    # no "triggering": the build is started by hand in Codemagic, not on every push
    scripts:
      - name: Install packages
        script: npm ci
      - name: Build the game
        script: npm run build
      - name: Copy the game into the iOS project
        script: npx cap sync ios
      - name: Use the signing profiles
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build the signed app
        # every Codemagic build gets a new build number; the version (1.0) comes from the project
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
